[package]
name = "opentrack-cli"
description = "OpenTrack command line: demo project builder, probe, offline render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "opentrack"
path = "src/main.rs"

[dependencies]
opentrack-core = { workspace = true }
opentrack-engine = { workspace = true }

[lib]
path = "src/lib.rs"

[features]
# AV1 export passthrough (engine gates rav1e; default builds stay pure).
export-av1 = ["opentrack-engine/export-av1"]
