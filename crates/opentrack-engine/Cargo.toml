[package]
name = "opentrack-engine"
description = "OpenTrack render engine: codec backends, offline audio mixer, render jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
opentrack-core = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Optional realtime output device (WASAPI / CoreAudio / ALSA). Kept optional
# so headless builds (CI containers without ALSA headers) still compile the
# full engine; the GUI enables it via its `audio` feature.
cpal = { version = "0.15", optional = true, default-features = false }

# Pure-Rust MP4/H.264 decode (M1 video preview). Both are MIT OR Apache-2.0;
# see ATTRIBUTION.md. craft-media rev is the same pin the upstream h264 crate
# is tested against; filmcraft-h264 is pinned to a reviewed upstream commit.
craft-media = { version = "0.1.0", default-features = false, features = [
    "isobmff",
], git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
filmcraft-h264 = { git = "https://github.com/storytold/filmcraft", rev = "c9be14245a6c9da585ff906a6e0ca9c8200652ea" }

# Pure-Rust image codecs for the M3 video pipeline (all MIT OR Apache-2.0):
# zune-jpeg decodes Motion-JPEG frames + JPEG stills, jpeg-encoder encodes
# AVI/MJPEG output, png handles PNG stills (read + write).
zune-jpeg = "0.5"
zune-core = "0.5"
jpeg-encoder = "0.6"
png = "0.18"

# Rhai scripting for project-level batch ops (M5). MIT OR Apache-2.0.
rhai = { version = "1.19", features = ["sync"] }

# Optional AV1 export behind the `export-av1` feature (M3). Default builds
# stay pure and never link it; the CLI gates the encoder behind the flag.
rav1e = { version = "0.7", optional = true, default-features = false, features = ["threading"] }

[features]
out-cpal = ["dep:cpal"]
export-av1 = ["dep:rav1e"]
