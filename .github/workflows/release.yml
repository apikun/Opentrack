# Builds release binaries for every supported platform (Windows first)
# and attaches them to the GitHub Release created for the pushed tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # PRIMARY platform
            target: x86_64-pc-windows-msvc
            cli: opentrack.exe
            app: opentrack-app.exe
            artifact: opentrack-x86_64-windows.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli: opentrack
            app: opentrack-app
            artifact: opentrack-x86_64-linux.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            cli: opentrack
            app: opentrack-app
            artifact: opentrack-aarch64-macos.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - name: Build release (CLI + GUI)
        run: cargo build --release -p opentrack-cli -p opentrack-app --target ${{ matrix.target }}
      - name: Package (zip — Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          7z a "${{ matrix.artifact }}" ${{ matrix.cli }} ${{ matrix.app }} ..\..\..\README.md ..\..\..\LICENSE
      - name: Package (tar — Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "${{ matrix.artifact }}" ${{ matrix.cli }} ${{ matrix.app }} ../../../README.md ../../../LICENSE
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          fail_on_unmatched_files: true
