# Builds release binaries for every supported platform (Windows first)
# and attaches them to the GitHub Release created for the pushed tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # PRIMARY platform
            target: x86_64-pc-windows-msvc
            cli: opentrack.exe
            app: opentrack-app.exe
            artifact: opentrack-x86_64-windows.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli: opentrack
            app: opentrack-app
            artifact: opentrack-x86_64-linux.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            cli: opentrack
            app: opentrack-app
            artifact: opentrack-aarch64-macos.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dev headers (Linux realtime audio, M2)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - name: Build release (CLI + GUI)
        run: cargo build --release -p opentrack-cli -p opentrack-app --target ${{ matrix.target }}
      - name: Build installer bundle (M5, best effort)
        continue-on-error: true
        shell: bash
        run: |
          # Package from the cross-compiled artifacts when available;
          # xtask falls back to a host build when the target dir is empty.
          cargo run -q -p xtask -- installer --out dist || echo "installer skipped on this runner" 
      - name: Package (zip — Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/stage"
          New-Item -ItemType Directory -Force "$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.cli }}" "$stage/"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.app }}" "$stage/"
          Copy-Item README.md, LICENSE "$stage/"
          7z a "${{ matrix.artifact }}" "$stage/*"
      - name: Package (tar — Unix)
        if: runner.os != 'Windows'
        run: |
          stage="${RUNNER_TEMP:-/tmp}/stage"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.cli }}" \
             "target/${{ matrix.target }}/release/${{ matrix.app }}" \
             README.md LICENSE "$stage/"
          tar czf "${{ matrix.artifact }}" -C "$stage" .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: true
